<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="trainerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <radialGradient id="coachAura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4ff00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="500" fill="url(#trainerBg)"/>
  <circle cx="300" cy="220" r="180" fill="url(#coachAura)"/>
  <circle cx="300" cy="220" r="140" fill="none" stroke="#d4ff00" stroke-width="3" opacity="0.35"/>
  <circle cx="300" cy="220" r="160" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="12 8"/>

  <!-- Trainer Portrait Silhouette -->
  <g transform="translate(300,230)">
    <!-- Head -->
    <circle cx="0" cy="-60" r="44" fill="#ffffff" opacity="0.95"/>
    <!-- Neck -->
    <rect x="-14" y="-22" width="28" height="24" fill="#e2e8f0"/>
    <!-- Athletic Traps & Shoulders -->
    <path d="M-85,30 C-65,-10 -25,-10 0,-10 C25,-10 65,-10 85,30 L65,130 L-65,130 Z" fill="#1b1f2e" stroke="#d4ff00" stroke-width="3"/>
    <!-- Jersey Collar -->
    <polygon points="-25,0 0,35 25,0" fill="#d4ff00"/>
    <!-- Badge -->
    <circle cx="0" cy="65" r="18" fill="#d4ff00"/>
    <text x="0" y="72" font-family="'Syne', Arial, sans-serif" font-weight="900" font-size="16" fill="#0c0e14" text-anchor="middle">E8</text>
  </g>

  <!-- Name & Tag -->
  <rect x="30" y="30" width="180" height="32" rx="6" fill="rgba(212,255,0,0.12)" stroke="#d4ff00" stroke-width="1"/>
  <text x="120" y="52" font-family="'Outfit', Arial, sans-serif" font-weight="800" font-size="13" fill="#d4ff00" text-anchor="middle" letter-spacing="1">CERTIFIED COACH</text>
  
  <text x="300" y="420" font-family="'Syne', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">Sarah Chen</text>
  <text x="300" y="450" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="16" fill="#d4ff00" text-anchor="middle" letter-spacing="2">FUNCTIONAL & CALISTHENICS</text>
</svg>